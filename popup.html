<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>电商图片下载助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f7f8fa;
      color: #222;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    header .count { font-size: 12px; color: #999; }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .toolbar button {
      flex: 1;
      padding: 7px 0;
      border: 1px solid #ff4f2e;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      color: #ff4f2e;
      transition: all .15s;
    }
    .toolbar button.primary { background: #ff4f2e; color: #fff; }
    .toolbar button:hover { opacity: .85; }
    .toolbar button:disabled { opacity: .4; cursor: not-allowed; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px 16px;
      max-height: 420px;
      overflow-y: auto;
    }
    .item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
      border: 2px solid transparent;
    }
    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .item .check {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(0,0,0,.45);
      border: 1px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .item.selected { border-color: #ff4f2e; }
    .item.selected .check { background: #ff4f2e; }
    .item .dl {
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: rgba(0,0,0,.55);
      border: none;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      line-height: 22px;
      text-align: center;
      display: none;
    }
    .item:hover .dl { display: block; }
    .empty {
      padding: 40px 0;
      text-align: center;
      color: #aaa;
      font-size: 13px;
    }
    footer {
      padding: 10px 16px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    footer .hint { font-size: 11px; color: #aaa; }
    .status { padding: 6px 16px; font-size: 12px; color: #e6a23c; background: #fdf6ec; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>电商图片下载助手</h1>
    <span class="count" id="count">共 0 张</span>
  </header>
  <div class="toolbar">
    <button id="selectAll">全选</button>
    <button id="downloadOne" disabled>下载选中</button>
    <button id="downloadZip" class="primary" disabled>打包 ZIP</button>
  </div>
  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">未在当前页面找到图片<br />请打开电商商品详情页后重试</div>
  <footer>
    <span class="hint">单张可点击图片右下角按钮</span>
    <span class="hint">v1.0.0</span>
  </footer>
  <script src="js/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
